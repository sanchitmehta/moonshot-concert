name: Deploy storefront

# Storefront team: packages the website and API, applies Terraform, then deploys the package.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-storefront

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            storefront/api/package-lock.json
            storefront/web/package-lock.json

      - name: Build website
        working-directory: storefront/web
        run: |
          npm ci
          npm run build

      - name: Check, test, and package API
        working-directory: storefront/api
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npm ci --omit=dev
          cp -r ../web/dist web
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > build-info.json
          npm pkg set 'scripts.start=node --import ./src/instrumentation.ts ./dist/server.js'
          zip -qr "$RUNNER_TEMP/app.zip" package.json src/instrumentation.ts dist node_modules web build-info.json

      - name: Check deployment package
        working-directory: storefront/api
        run: |
          mkdir "$RUNNER_TEMP/storefront-package"
          unzip -q "$RUNNER_TEMP/app.zip" -d "$RUNNER_TEMP/storefront-package"
          STOREFRONT_PACKAGE_DIR="$RUNNER_TEMP/storefront-package" node --test test/deployment/package.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: storefront-package
          path: ${{ runner.temp }}/app.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  infrastructure:
    needs: package
    uses: ./.github/workflows/terraform.yml
    with:
      root: storefront
      apply: true

  app:
    needs: [package, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: storefront-package
          path: ${{ runner.temp }}

      - name: Read environment
        run: |
          env=infra/environment.json
          {
            echo "TENANT_ID=$(jq -r .tenantId $env)"
            echo "SUBSCRIPTION_ID=$(jq -r .subscriptionId $env)"
            echo "CLIENT_ID=$(jq -r .githubClientIds.storefront $env)"
            echo "RESOURCE_GROUP=$(jq -r .resourceGroups.storefront $env)"
          } >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Deploy staging, verify, and swap
        run: bash .github/scripts/deploy-slot.sh app-moonshot-storefront storefront-api
