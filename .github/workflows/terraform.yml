name: Terraform

# Reusable: plans one Terraform root with that team's GitHub identity, and applies it when asked.
on:
  workflow_call:
    inputs:
      root:
        description: Folder under infra/ (shared, data-platform, storefront)
        type: string
        required: true
      apply:
        type: boolean
        default: false
      allow_production_changes:
        description: Allow production app or plan changes during a maintenance window
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      root:
        description: Terraform root
        type: choice
        required: true
        options: [shared, data-platform, storefront]
      apply:
        description: Apply the plan
        type: boolean
        default: false
      allow_production_changes:
        description: Allow production app or plan changes (maintenance window required)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: ${{ inputs.apply && 'apply' || 'plan' }} ${{ inputs.root }}
    runs-on: ubuntu-latest
    concurrency: terraform-${{ inputs.root }}-${{ inputs.apply && 'apply' || 'plan' }}
    defaults:
      run:
        working-directory: infra/${{ inputs.root }}
    steps:
      - uses: actions/checkout@v4

      - name: Select identity and state
        run: |
          team="${{ inputs.root }}"; team="${team//-/}"
          env=../environment.json
          {
            echo "TEAM=$team"
            echo "ARM_USE_OIDC=true"
            echo "ARM_USE_AZUREAD=true"
            echo "ARM_TENANT_ID=$(jq -r .tenantId $env)"
            echo "ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId $env)"
            echo "ARM_CLIENT_ID=$(jq -r --arg t "$team" '.githubClientIds[$t]' $env)"
            echo "STATE_ACCOUNT=$(jq -r .stateStorageAccount $env)"
            echo "AWS_DEPLOY_ROLE=$(jq -r .aws.githubDataPlatformRole $env)"
            echo "AWS_DEPLOY_REGION=$(jq -r .aws.region $env)"
          } >> "$GITHUB_ENV"

      # The Data Platform root also owns AWS resources; sign in to AWS with OIDC (no keys).
      - name: Sign in to AWS
        if: inputs.root == 'data-platform'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_DEPLOY_REGION }}
          role-session-name: github-terraform-data-platform

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="storage_account_name=$STATE_ACCOUNT"
          -backend-config="container_name=tfstate-$TEAM"
          -backend-config="key=$TEAM.tfstate"
          -backend-config="use_azuread_auth=true"

      - run: terraform fmt -check
      - run: terraform validate
      # Replacing the API changes the IPs used as AWS ingress rule keys. Materialize
      # the new app first so the following full plan can calculate those keys.
      - name: Prepare data-platform app region change
        if: inputs.apply && inputs.root == 'data-platform'
        env:
          ALLOW_PRODUCTION_CHANGES: ${{ inputs.allow_production_changes }}
        run: |
          current=$(terraform show -json | jq -r \
            '.values.root_module.resources[]? | select(.address == "azurerm_linux_web_app.api") | .values.location')
          desired=$(printf 'local.app_location\n' | terraform console | tr -d '"')
          current=$(echo "$current" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
          if [[ "$current" != "$desired" ]]; then
            if [[ "$ALLOW_PRODUCTION_CHANGES" != "true" ]]; then
              echo "Region changes require the Terraform maintenance workflow with allow_production_changes." >&2
              exit 1
            fi
            terraform plan -input=false -target=azurerm_linux_web_app.api -out=app-region.tfplan
            terraform show -json app-region.tfplan | jq -e '
              all(.resource_changes[]?;
                (.change.actions | index("delete")) == null or
                .address == "azurerm_linux_web_app.api" or
                .address == "azurerm_service_plan.main")
            ' >/dev/null || {
              echo "Region migration would delete resources other than the API and its plan." >&2
              exit 1
            }
            terraform apply -input=false app-region.tfplan
          fi
      # Plans that will not be applied (CI) read state without locking, so they never block a deployment.
      - run: terraform plan -input=false -lock=${{ inputs.apply }} -out=tfplan

      - name: Protect production during app releases
        if: inputs.apply && !inputs.allow_production_changes
        run: terraform show -json tfplan | python ../../.github/scripts/check_slot_plan.py

      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
